services:
  - type: web
    name: growthpilot-channel
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /channel/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: CRM_CALLBACK_URL
        sync: false
      - key: SIM_FAILURE_RATE
        value: "0.10"
      - key: CALLBACK_RETRY_ATTEMPTS
        value: "3"
      - key: CALLBACK_RETRY_DELAY_MS
        value: "1000"
      # Per-channel stage probabilities (optional — built-in defaults used if unset)
      # - key: CHANNEL_SIM_WHATSAPP_DELIVERY
      #   value: "0.94"
      # - key: CHANNEL_SIM_WHATSAPP_OPEN
      #   value: "0.75"
      # - key: CHANNEL_SIM_WHATSAPP_READ
      #   value: "0.80"
      # - key: CHANNEL_SIM_WHATSAPP_CLICK
      #   value: "0.28"
      # - key: CHANNEL_SIM_WHATSAPP_PURCHASE
      #   value: "0.10"
      # - key: CHANNEL_SIM_EMAIL_DELIVERY
      #   value: "0.90"
      # - key: CHANNEL_SIM_EMAIL_OPEN
      #   value: "0.48"
      # - key: CHANNEL_SIM_EMAIL_READ
      #   value: "0.60"
      # - key: CHANNEL_SIM_EMAIL_CLICK
      #   value: "0.14"
