name: Channel CI

on:
  push:
    branches: [main]
    paths:
      - 'growthpilot-channel/**'
      - '.github/workflows/channel-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'growthpilot-channel/**'
      - '.github/workflows/channel-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growthpilot-channel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: growthpilot-channel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck
