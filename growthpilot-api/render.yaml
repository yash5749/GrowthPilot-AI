services:
  - type: web
    name: growthpilot-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: CHANNEL_SERVICE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_MODELS_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: mock
